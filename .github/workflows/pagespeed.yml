name: PageSpeed Monitor

on:
  schedule:
    # Runs at 10:00 AM UTC on the 15th and 30th
    - cron: '0 10 15,30 * *'

  workflow_dispatch:

jobs:
  pagespeed:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PageSpeed Script
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: python pagespeed_monitor.py

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pagespeed-report
          path: reports/
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pagespeed-screenshots
          path: screenshots/
          if-no-files-found: warn
